# .autospec/plan/services/worker.yaml
name: worker
path: services/worker
language: python
commands:
  setup: docker compose -f docker-compose.dev.yml run --rm worker-dev uv sync --frozen
  build: docker compose -f docker-compose.dev.yml run --rm worker-dev uv run --frozen python -m compileall -q src
  lint:  docker compose -f docker-compose.dev.yml run --rm worker-dev sh -c 'uv run --frozen ruff format --check . && uv run --frozen ruff check . && uv run --frozen mypy src'
  test:  docker compose -f docker-compose.dev.yml run --rm worker-dev uv run --frozen pytest -q   # full suite; green only once every task is done
  # {files} = space-separated paths RELATIVE TO services/worker
  test_files: docker compose -f docker-compose.dev.yml run --rm worker-dev uv run --frozen pytest -q {files}
baseline_tests:
  - services/worker/tests/unit/test_errors.py
  - services/worker/tests/unit/test_fake_models.py
  - services/worker/tests/unit/test_chunk_annotator.py
regression: [build, lint, baseline_tests, done_tests]
