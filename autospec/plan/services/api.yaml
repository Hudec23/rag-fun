# autospec/plan/services/api.yaml
# Every command runs from the repo root inside the runner container (which has Docker via DinD).
name: api
path: services/api
language: python
commands:
  setup: docker compose -f docker-compose.dev.yml run --rm api-dev uv sync --frozen
  build: docker compose -f docker-compose.dev.yml run --rm api-dev uv run --frozen python -m compileall -q src
  lint:  docker compose -f docker-compose.dev.yml run --rm api-dev sh -c 'uv run --frozen ruff format --check . && uv run --frozen ruff check . && uv run --frozen mypy src'
  test:  docker compose -f docker-compose.dev.yml run --rm api-dev uv run --frozen pytest -q   # full suite; green only once every task is done
  # {files} = space-separated paths RELATIVE TO services/api
  test_files: docker compose -f docker-compose.dev.yml run --rm api-dev uv run --frozen pytest -q {files}
# Written by the walking skeleton; must always pass.
baseline_tests:
  - services/api/tests/unit/test_health.py
  - services/api/tests/unit/test_errors.py
  - services/api/tests/integration/test_collections_get.py
regression: [build, lint, baseline_tests, done_tests]
