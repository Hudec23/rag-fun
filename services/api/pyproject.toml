[project]
name = "rag-api"
version = "1.0.0"
description = "rag-fun public + internal HTTP API"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "sqlalchemy[asyncio]==2.1.6",
    "asyncpg==0.32.0",
    "alembic==1.20.1",
    "arq==0.28.0",
    "redis==5.3.1",
    "sse-starlette==3.6.0",
    "python-multipart==0.0.33",
    "aioboto3==15.5.0",
    "qdrant-client==1.20.0",
    "httpx==0.28.1",
    "structlog==26.1.0",
    "uuid-utils==1.2.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "ruff==0.17.3",
    "mypy==2.4.1",
    "respx==0.23.1",
    "jsonschema==4.26.0",
    "pyyaml==6.0.3",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rag_api"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/rag_api/contracts_gen"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]  # formatter enforces width; long docstrings are allowed

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form", "fastapi.Header", "fastapi.Path"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["src/rag_api/contracts_gen/"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "rag_api.contracts_gen.*"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
